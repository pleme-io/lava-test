[package]
authors = ["pleme-io"]
description = "lava-test — typed TDD/BDD framework for lava architectures + the wider tatara-lisp ecosystem. Typed Assertion trait + AssertContext + TestCase + TestSuite + Runner. Architecture assertions ship as the first concrete impls (ResourceExists / AttributeEquals / ResourceCount / OutputEquals / RefValid / NoResource); downstream tatara-lisp consumers implement Assertion for their own domains."
edition = "2024"
license = "MIT"
name = "lava-test"
readme = "README.md"
repository = "https://github.com/pleme-io/lava-test"
version = "0.1.0"

[lib]
name = "lava_test"
path = "src/lib.rs"

[lints.clippy]
pedantic = "warn"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }
thiserror = "2"
lava-core = { git = "https://github.com/pleme-io/lava-core", branch = "main" }
lava-eval = { git = "https://github.com/pleme-io/lava-eval", branch = "main" }
